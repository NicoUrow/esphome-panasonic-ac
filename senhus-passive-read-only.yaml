esphome:
  name: senhus-pac-debug
  friendly_name: Senhus PAC Debug
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: arduino

logger:
  level: VERBOSE

api:
  encryption:
    key: "M55d0+kDN7g5aAjIpBXlpXsdA2a88ZC1emD0nJuCVaE="

ota:
  - platform: esphome

wifi:
  use_address: 192.168.10.94
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 8.5dB

  ap:
    ssid: "Senhus-PAC-Debug"
    password: "q9Jktf3DaLxT"

captive_portal:

# Passive CN-CNT monitor: RX only. No TX pin is configured and no Panasonic
# component is loaded, so this firmware does not intentionally transmit UART data.
uart:
  id: panasonic_bus
  rx_pin: GPIO3
  baud_rate: 9600
  parity: EVEN
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 20ms
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, '.');

button:
  - platform: restart
    name: "ESP Reboot"
