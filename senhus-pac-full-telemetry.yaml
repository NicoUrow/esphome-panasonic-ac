esphome:
  name: senhus-pac-debug
  friendly_name: Senhus PAC Debug
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: arduino

logger:
  level: VERBOSE

api:

ota:
  - platform: esphome

wifi:
  use_address: 192.168.10.94
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 8.5dB
  ap:
    ssid: "Senhus-PAC-Debug"
    password: "q9Jktf3DaLxT"

captive_portal:

web_server:
  port: 80

uart:
  id: panasonic_uart
  tx_pin: GPIO3
  rx_pin: GPIO4
  baud_rate: 9600
  parity: EVEN
  debug:
    direction: RX
    after:
      timeout: 20ms
    sequence:
      - lambda: |-
          // Standard CN-CNT poll response: 35 bytes, header 0x70, payload length 0x20.
          // Do not decode shifted/non-standard frames.
          if (bytes.size() != 35 || bytes[0] != 0x70 || bytes[1] != 0x20) {
            return;
          }

          const uint8_t status = bytes[12];
          id(pac_status_code).publish_state(status);

          const char *status_text = "UNKNOWN";
          switch (status) {
            case 0x00: status_text = "OFF"; break;
            case 0x04: status_text = "POWER_DOWN"; break;
            case 0x08: status_text = "FAN_ONLY_OFF_EXPERIMENTAL"; break;
            case 0x30: status_text = "COOL_IDLE"; break;
            case 0x34: status_text = "COOL_TRANSITION"; break;
            case 0x38: status_text = "COOL_START"; break;
            case 0x3C: status_text = "COOL_RUNNING"; break;
            case 0x40: status_text = "HEAT_IDLE"; break;
            case 0x44: status_text = "HEAT_TRANSITION"; break;
            case 0x48: status_text = "HEAT_START"; break;
            case 0x4C: status_text = "HEAT_RUNNING"; break;
          }
          id(pac_operational_status).publish_state(status_text);

          id(pac_running).publish_state(status == 0x3C || status == 0x4C);
          id(pac_status_bit2).publish_state((status & 0x04) != 0);
          id(pac_status_bit3).publish_state((status & 0x08) != 0);

          // Byte 13 = internal setting temperature, raw half-degrees.
          id(pac_internal_target).publish_state(bytes[13] * 0.5f);
          id(pac_internal_target_offset).publish_state(((int) bytes[13] - (int) bytes[3]) * 0.5f);

          // Model/platform-specific bytes. Keep raw for identification.
          id(pac_model_byte16).publish_state(bytes[16]);
          id(pac_model_byte17).publish_state(bytes[17]);

          // Environmental telemetry; 0x80 means unsupported.
          if (bytes[20] != 0x80 && bytes[20] <= 100) {
            id(pac_humidity).publish_state(bytes[20]);
          }
          if (bytes[21] != 0x80) {
            id(pac_indoor_coil_temperature).publish_state((int8_t) bytes[21]);
          }
          if (bytes[22] != 0x80) {
            id(pac_outside_temperature_alt).publish_state((int8_t) bytes[22]);
          }

          // Power/current fields documented by panasonic-cn-cnt reverse engineering.
          const uint16_t raw_power = (uint16_t) bytes[28] | ((uint16_t) bytes[29] << 8);
          id(pac_outdoor_raw_power).publish_state(raw_power);
          id(pac_estimated_total_power).publish_state(raw_power * 1.10f);
          id(pac_compressor_current).publish_state(bytes[30] / 5.0f);

          // Multiplexed model / feature slots. Raw values are useful for discovering this unit.
          id(pac_mux_selector).publish_state(bytes[31]);
          id(pac_mux_data1).publish_state(bytes[32]);
          id(pac_mux_data2).publish_state(bytes[33]);

          // Slot 2 (0xC0) is documented as Nanoe-X feature status.
          if (bytes[31] == 0xC0) {
            id(pac_mux_nanoex).publish_state((bytes[32] & 0x04) != 0);
          }

external_components:
  - source: github://DomiStyle/esphome-panasonic-ac
    components:
      - panasonic_ac

climate:
  - platform: panasonic_ac
    type: cnt
    uart_id: panasonic_uart
    name: "Panasonic Gainable"

    outside_temperature:
      name: "PAC Température extérieure"

    current_power_consumption:
      name: "PAC Puissance composant"

    defrost_sensor:
      name: "PAC Dégivrage"

    nanoex_switch:
      name: "PAC nanoe X"

    eco_switch:
      name: "PAC Eco"

    econavi_switch:
      name: "PAC Econavi"

    mild_dry_switch:
      name: "PAC Mild Dry"

sensor:
  - platform: template
    id: pac_status_code
    name: "PAC Code état CN-CNT"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pac_internal_target
    name: "PAC Consigne interne"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: pac_internal_target_offset
    name: "PAC Offset consigne interne"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: pac_humidity
    name: "PAC Humidité intérieure"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pac_indoor_coil_temperature
    name: "PAC Température échangeur intérieur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pac_outside_temperature_alt
    name: "PAC Température extérieure alternative"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pac_outdoor_raw_power
    name: "PAC Puissance unité extérieure brute"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pac_estimated_total_power
    name: "PAC Puissance totale estimée"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pac_compressor_current
    name: "PAC Courant compresseur"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: pac_model_byte16
    name: "PAC Octet modèle 16"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pac_model_byte17
    name: "PAC Octet modèle 17"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pac_mux_selector
    name: "PAC MUX sélecteur"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pac_mux_data1
    name: "PAC MUX donnée 1"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pac_mux_data2
    name: "PAC MUX donnée 2"
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: template
    id: pac_operational_status
    name: "PAC État opérationnel détaillé"
    update_interval: never

binary_sensor:
  - platform: template
    id: pac_running
    name: "PAC Fonctionnement actif"

  - platform: template
    id: pac_status_bit2
    name: "PAC État bit 2 expérimental"

  - platform: template
    id: pac_status_bit3
    name: "PAC État bit 3 expérimental"

  - platform: template
    id: pac_mux_nanoex
    name: "PAC Nanoe X via MUX"

button:
  - platform: restart
    name: "ESP Reboot"
